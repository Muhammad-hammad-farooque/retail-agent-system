services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Loopback only: the database must never be reachable from the internet
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  omniroute:
    # AI gateway: one OpenAI-compatible endpoint with failover across providers.
    # Pinned version so an upstream release can't break the app unexpectedly.
    image: diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    env_file:
      - .env.omniroute
    environment:
      - DATA_DIR=/app/data
    ports:
      # Loopback only. Dashboard is reached via SSH tunnel on a server:
      #   ssh -L 20128:localhost:20128 user@server
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute_data:/app/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL from .env to use Docker internal hostname
      - DATABASE_URL=postgresql://postgres:postgres@postgres/retail_db
      # Reach OmniRoute by service name over the internal Compose network
      - AI_BASE_URL=http://omniroute:20128/v1
    depends_on:
      postgres:
        condition: service_healthy
      omniroute:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time and used by the *browser*.
        # For deployment set PUBLIC_API_URL / PUBLIC_WS_URL to your server's
        # public address before building, e.g. http://203.0.113.10:8000
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  omniroute_data:
